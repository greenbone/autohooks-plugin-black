name: Check and test Python package

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    strategy:
      matrix:
        python-version:
            - "3.11"
            - "3.12"
            - "3.13"
            - "3.14"
            - "3.15"

    name: Check and test
    uses: greenbone/workflows/.github/workflows/ci-python.yml@main
    with:
      lint-packages: autohooks tests
      linter: ruff check
      python-version: ${{ matrix.python-version }}


  codecov:
    name: Upload coverage to codecov.io
    # run action directly because GitHub has an internal error when using our
    # generic reusable workflow
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install and calculate and upload coverage to codecov.io
        uses: greenbone/actions/coverage-python@v3
        with:
          python-version: "3.11"
          token: ${{ secrets.CODECOV_TOKEN }}

  all-python-ci-jobs-passed:
    name: All Python CI jobs passed
    needs: [lint-and-test, codecov]
    if: ${{ always() }}
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - name: Require all CI jobs to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<<"$NEEDS"
